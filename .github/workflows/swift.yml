name: Swift

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: macOS-26
    defaults:
      run:
        shell: bash # Enables fail-fast behaviour via set -eo pipefail

    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: brew install swiftformat swiftlint

      - name: Check formatting
        run: swiftformat --lint .

      - name: Lint
        run: swiftlint lint --strict

  macOS:
    runs-on: macOS-26
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Get Swift version
        run: swift --version

      - name: Run tests
        run: swift test --enable-code-coverage

      - name: Output coverage
        run: ./coverage.sh

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          name: codecov-umbrella
          verbose: true

  # `swift test` only ever builds the macOS slice, so the UIKit sources and their
  # tests are never compiled by the macOS job above.
  iOS:
    runs-on: macOS-26
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Run tests
        run: |
          xcodebuild test \
            -scheme PFToolbox \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro'

  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Get Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
